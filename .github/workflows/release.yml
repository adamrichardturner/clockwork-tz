name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every release step except publishing (npm publish --dry-run, no GitHub release)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@latest

      - name: Resolve version and dist-tag
        id: meta
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" != "true" ]; then
            echo "Manual runs are dry runs only; push a v$VERSION tag to release" >&2
            exit 1
          fi
          case "$VERSION" in
            *-alpha*) TAG=alpha ;;
            *-beta*) TAG=beta ;;
            *-rc*) TAG=rc ;;
            *-*) TAG=next ;;
            *) TAG=latest ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN:-false}" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION with dist-tag $TAG (dry run: ${DRY_RUN:-false})"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - run: npm run check:pkg

      # Uses npm trusted publishing (OIDC): link this workflow with `npm trust github`.
      # Skipped when the version is already on npm (e.g. a first release published by hand).
      # --ignore-scripts: prepublishOnly would repeat the checks above.
      - name: Publish
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
        run: |
          if [ "${{ steps.meta.outputs.dry_run }}" = "true" ]; then
            npm publish --dry-run --ignore-scripts --access public --provenance=false --tag "$DIST_TAG"
          elif npm view "clockworktz@$VERSION" version > /dev/null 2>&1; then
            echo "clockworktz@$VERSION is already published; skipping"
          else
            npm publish --ignore-scripts --provenance --access public --tag "$DIST_TAG"
          fi

      - name: GitHub release
        if: steps.meta.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          PRERELEASE=""
          if [ "${{ steps.meta.outputs.dist_tag }}" != "latest" ]; then PRERELEASE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag $PRERELEASE
