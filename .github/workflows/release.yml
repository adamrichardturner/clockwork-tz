name: Release

# Every merge to main is checked for releasable Conventional Commits since the
# last tag (feat → minor, fix/perf → patch, ! or BREAKING CHANGE → major). If
# there are any, this bumps the version, updates CHANGELOG.md, commits and tags
# "chore(release): vX.Y.Z", publishes to npm with provenance and creates the
# GitHub release. Each step skips work that is already done, so a failed run
# can simply be re-run.
#
# The file name must stay release.yml: npm trusted publishing is linked to it.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Show what would be released without committing, tagging or publishing'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

# Releases run one at a time, in merge order
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # The release commit pushed by this workflow uses GITHUB_TOKEN and does not
    # trigger it again; this guard covers manual pushes of release commits too
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history and tags to find the last release
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@latest

      - run: npm ci

      - name: Plan the release
        id: plan
        run: node scripts/release.ts --notes-file "$RUNNER_TEMP/notes.md"

      - name: Run every check
        if: steps.plan.outputs.release == 'true'
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run test:run
          npm run build
          npm run check:pkg

      - name: Stop here for a dry run
        if: steps.plan.outputs.release == 'true' && (github.ref != 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.dry_run))
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          echo "Dry run: would release v$VERSION with these notes:"
          cat "$RUNNER_TEMP/notes.md"
          npm version "$VERSION" --no-git-tag-version --allow-same-version > /dev/null
          npm run build > /dev/null
          npm publish --dry-run --ignore-scripts --access public --provenance=false

      - name: Commit and tag the release
        id: commit
        # Only main is ever released; a manual run on another branch is always a dry run
        if: steps.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node scripts/release.ts --write > /dev/null
          npx prettier --write CHANGELOG.md package.json package-lock.json
          git add CHANGELOG.md package.json package-lock.json
          git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "clockworktz $VERSION"
          # Atomic: the commit and tag land together or not at all
          git push --atomic origin HEAD:main "v$VERSION"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Build the release
        if: steps.commit.outputs.pushed == 'true'
        run: npm run build

      - name: Publish to npm
        if: steps.commit.outputs.pushed == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          if npm view "clockworktz@$VERSION" version > /dev/null 2>&1; then
            echo "clockworktz@$VERSION is already published; skipping"
          else
            npm publish --ignore-scripts --provenance --access public
          fi

      - name: Create the GitHub release
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists"
          else
            gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi

  # A release commit and tag can exist without an npm package if a previous
  # publish failed; re-running this job (or the workflow) publishes it
  recover:
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && github.ref == 'refs/heads/main'
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - name: Update npm
        run: npm install -g npm@latest
      - name: Publish the tagged version if npm doesn't have it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "clockworktz@$VERSION" version > /dev/null 2>&1; then
            echo "clockworktz@$VERSION is on npm"
          else
            npm ci
            npm run build
            npm publish --ignore-scripts --provenance --access public
          fi
          gh release view "v$VERSION" > /dev/null 2>&1 || gh release create "v$VERSION" --title "v$VERSION" --generate-notes --verify-tag
