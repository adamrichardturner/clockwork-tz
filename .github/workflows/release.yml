name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Check tag matches package version
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi
          case "$VERSION" in
            *-alpha*) TAG=alpha ;;
            *-beta*) TAG=beta ;;
            *-rc*) TAG=rc ;;
            *-*) TAG=next ;;
            *) TAG=latest ;;
          esac
          echo "dist_tag=$TAG" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - run: npm run check:pkg

      # Uses npm trusted publishing (OIDC); configure it for this workflow on npmjs.com
      - name: Publish
        run: npm publish --provenance --access public --tag ${{ steps.meta.outputs.dist_tag }}

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [ "${{ steps.meta.outputs.dist_tag }}" != "latest" ]; then PRERELEASE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --generate-notes $PRERELEASE
