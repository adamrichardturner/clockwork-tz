name: TZDB Update

on:
  schedule:
    # Daily at 02:00 UTC; IANA releases are irregular and sometimes urgent
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'tzdb version to build (default: latest)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: tzdb-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Compare versions
        id: versions
        run: |
          LATEST="${{ inputs.version }}"
          if [ -z "$LATEST" ]; then
            LATEST=$(curl -fsS https://data.iana.org/time-zones/tzdb/version)
          fi
          CURRENT=$(node -p "require('./packages/clockwork-tz-data/tzdb.json').version")
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$LATEST" != "$CURRENT" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Current: $CURRENT, latest: $LATEST"

      - name: Install dependencies
        if: steps.versions.outputs.changed == 'true'
        run: npm ci

      - name: Build tzdb data
        if: steps.versions.outputs.changed == 'true'
        run: node scripts/build-tzdb.ts "${{ steps.versions.outputs.latest }}"

      - name: Sign data and write manifest
        if: steps.versions.outputs.changed == 'true'
        env:
          TZDB_SIGNING_KEY: ${{ secrets.TZDB_SIGNING_KEY }}
        run: node scripts/sign-tzdb.ts

      - name: Test against new data
        if: steps.versions.outputs.changed == 'true'
        run: |
          npm run typecheck
          npm run build
          npm run test:run

      - name: Publish clockwork-tz-data
        if: steps.versions.outputs.changed == 'true'
        working-directory: packages/clockwork-tz-data
        run: npm publish --provenance --access public

      - name: Open pull request with the new bundled snapshot
        if: steps.versions.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: tzdb-update-${{ steps.versions.outputs.latest }}
          commit-message: 'feat(tzdb): update bundled data to ${{ steps.versions.outputs.latest }}'
          title: 'feat(tzdb): update bundled data to ${{ steps.versions.outputs.latest }}'
          body: |
            Updates the bundled IANA timezone database from ${{ steps.versions.outputs.current }} to ${{ steps.versions.outputs.latest }}.

            - Built with `scripts/build-tzdb.ts` and signed with `scripts/sign-tzdb.ts`
            - `clockwork-tz-data` has been published, so the signed manifest on jsDelivr already serves this release
            - Tests passed against the new data

            Release notes: https://data.iana.org/time-zones/tzdb/NEWS
