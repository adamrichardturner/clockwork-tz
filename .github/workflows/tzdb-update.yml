name: TZDB Update

on:
  schedule:
    # Daily at 02:00 UTC; IANA releases are irregular and sometimes urgent
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'tzdb version to build (default: latest)'
        required: false
        type: string
      dry_run:
        description: 'Build, sign and test only: no publish, no pull request'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write

concurrency:
  group: tzdb-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Compare versions
        id: versions
        env:
          REQUESTED: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          LATEST="$REQUESTED"
          if [ -z "$LATEST" ]; then
            LATEST=$(curl -fsS https://data.iana.org/time-zones/tzdb/version)
          fi
          if ! echo "$LATEST" | grep -Eq '^[0-9]{4}[a-z]+$'; then
            echo "Unexpected tzdb version: $LATEST" >&2
            exit 1
          fi
          CURRENT=$(node -p "require('./packages/clockworktz-data/tzdb.json').version")
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          # A dry run always builds, so the pipeline can be tested without a new release
          if [ "$LATEST" != "$CURRENT" ] || [ "$DRY_RUN" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Current: $CURRENT, latest: $LATEST, dry run: ${DRY_RUN:-false}"

      - name: Install dependencies
        if: steps.versions.outputs.build == 'true'
        run: npm ci

      - name: Build tzdb data
        if: steps.versions.outputs.build == 'true'
        env:
          TZDB_REQUIRE_SIGNATURE: '1'
        run: node scripts/build-tzdb.ts "${{ steps.versions.outputs.latest }}"

      - name: Sign data and write manifest
        if: steps.versions.outputs.build == 'true'
        env:
          TZDB_SIGNING_KEY: ${{ secrets.TZDB_SIGNING_KEY }}
        run: node scripts/sign-tzdb.ts

      - name: Test against new data
        if: steps.versions.outputs.build == 'true'
        run: |
          npm run typecheck
          npm run build
          npm run test:run

      # Trusted publishing (OIDC) needs npm 11.5.1 or later
      - name: Update npm
        if: steps.versions.outputs.build == 'true'
        run: npm install -g npm@latest

      - name: Publish clockworktz-data
        if: steps.versions.outputs.build == 'true'
        working-directory: packages/clockworktz-data
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --dry-run --access public --provenance=false
          elif npm view "clockworktz-data@$VERSION" version > /dev/null 2>&1; then
            echo "clockworktz-data@$VERSION is already published; skipping"
          else
            npm publish --provenance --access public
          fi

      - name: Refresh the jsDelivr cache for the manifest
        if: steps.versions.outputs.build == 'true' && inputs.dry_run != true
        run: curl -fsS https://purge.jsdelivr.net/npm/clockworktz-data@1/manifest.json || true

      - name: Open pull request with the new bundled snapshot
        id: pr
        if: steps.versions.outputs.build == 'true' && inputs.dry_run != true
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          branch: tzdb-update-${{ steps.versions.outputs.latest }}
          commit-message: 'feat(tzdb): update bundled data to ${{ steps.versions.outputs.latest }}'
          title: 'feat(tzdb): update bundled data to ${{ steps.versions.outputs.latest }}'
          body: |
            Updates the bundled IANA timezone database from ${{ steps.versions.outputs.current }} to ${{ steps.versions.outputs.latest }}.

            - Built with `scripts/build-tzdb.ts` (IANA signatures verified) and signed with `scripts/sign-tzdb.ts`
            - `clockworktz-data` is published, so the signed manifest on jsDelivr already serves this release
            - Tests passed against the new data, and CI is started on this branch automatically

            Release notes: https://data.iana.org/time-zones/tzdb/NEWS

            After merging, release the library (bump the patch version and push a tag) so new installs get the new snapshot.

      # Pull requests opened with GITHUB_TOKEN don't trigger other workflows, so start CI explicitly
      - name: Run CI on the pull request branch
        if: steps.pr.outcome == 'success' && steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "tzdb-update-${{ steps.versions.outputs.latest }}"

      # Opening pull requests needs "Allow GitHub Actions to create and approve pull requests".
      # Without it the branch is still pushed, so raise an issue linking to it instead.
      - name: Open an issue when the pull request could not be created
        if: steps.pr.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.versions.outputs.latest }}
          CURRENT: ${{ steps.versions.outputs.current }}
        run: |
          gh issue create \
            --title "tzdb $LATEST is ready: open the pull request" \
            --body "The TZDB Update workflow built, signed, tested and published tzdb $LATEST (from $CURRENT), but could not open a pull request.

          Open it from the pushed branch: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...tzdb-update-$LATEST?expand=1

          To let the workflow open pull requests itself, enable Settings → Actions → General → Allow GitHub Actions to create and approve pull requests.

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
